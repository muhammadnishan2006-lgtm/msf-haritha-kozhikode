<!DOCTYPE html>

<head>

    <meta name="color-scheme" content="light">
    <title>State Youth Summit 2026 - Official Registration & Portal</title>
    <!-- Tailwind CSS CDN -->

    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {

            from { opacity: 0; transform: translateY(8px); }

</head>

        const IconTrash = () => (<svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>);
        const IconCamera = () => (<svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path strokeLinecap="round" strokeLinejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>);

        const CONSTITUENCIES = [
            'Vadakara',
            'Kuttiady',
            'Nadapuram',
            'Koyilandy',
            'Perambra',
            'Balussery',
            'Elathur',
            'Kozhikode North',
            'Kozhikode South',
            'Beypore',
            'Kunnamangalam',
            'Koduvally',

        ];

        const INITIAL_REGISTRATIONS = [
            { id: 'REG-1001', fullName: 'Rahul Menon', phone: '+91 9847123456', email: 'rahul.menon@example.com', panchayat: 'Kallai Ward', constituency: 'Kozhikode South', campus: 'Farook College', position: 'President', status: 'Approved', date: '2026-09-20', notificationSent: true, photo: null, customAnswers: { 'T-Shirt Size': 'L', 'Dietary Preference': 'Vegetarian' } },
            { id: 'REG-1002', fullName: 'Ananya S.', phone: '+91 9446554433', email: 'ananya.s@example.com', panchayat: 'Mavoor Road', constituency: 'Kozhikode North', campus: 'Providence College', position: 'Secretary', status: 'Approved', date: '2026-09-21', notificationSent: true, photo: null, customAnswers: { 'T-Shirt Size': 'M', 'Dietary Preference': 'Non-Vegetarian' } },
            { id: 'REG-1003', fullName: 'Muhammed Ali', phone: '+91 9895012345', email: 'muhammed.ali@example.com', panchayat: 'Beypore Port', constituency: 'Beypore', campus: 'None', position: 'Joint Secretary', status: 'Pending', date: '2026-09-22', notificationSent: false, photo: null, customAnswers: { 'T-Shirt Size': 'XL', 'Dietary Preference': 'Vegetarian' } },
            { id: 'REG-1004', fullName: 'Sneha Mary', phone: '+91 9567811223', email: 'sneha.mary@example.com', panchayat: 'Kunnamangalam Town', constituency: 'Kunnamangalam', campus: 'NIT Calicut', position: 'Executive Member', status: 'Pending', date: '2026-09-23', notificationSent: false, photo: null, customAnswers: { 'T-Shirt Size': 'S', 'Dietary Preference': 'Vegan' } },
            { id: 'REG-1005', fullName: 'Adithya Varma', phone: '+91 9745678901', email: 'adithya.v@example.com', panchayat: 'Balussery Bazaar', constituency: 'Balussery', campus: 'Govt College Balussery', position: 'Vice President', status: 'Approved', date: '2026-09-24', notificationSent: true, photo: null, customAnswers: { 'T-Shirt Size': 'L', 'Dietary Preference': 'Non-Vegetarian' } }
        ];

        // Self-contained banner artwork (no network fetch) used as the default
        // event image and as the fallback whenever a configured image fails to load.
        const DEFAULT_BANNER_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400">
            <defs>
                <linearGradient id="bannerBg" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#312e81"/>
                    <stop offset="55%" stop-color="#4338ca"/>
                    <stop offset="100%" stop-color="#6d28d9"/>
                </linearGradient>
            </defs>
            <rect width="1600" height="400" fill="url(#bannerBg)"/>
            <circle cx="180" cy="70" r="150" fill="#ffffff" opacity="0.05"/>
            <circle cx="1420" cy="330" r="230" fill="#ffffff" opacity="0.06"/>
            <circle cx="920" cy="40" r="90" fill="#ffffff" opacity="0.05"/>
            <circle cx="1220" cy="140" r="46" fill="#f0abfc" opacity="0.16"/>
            <circle cx="360" cy="300" r="70" fill="#818cf8" opacity="0.2"/>
            <circle cx="720" cy="330" r="34" fill="#fbbf24" opacity="0.18"/>
            <circle cx="1050" cy="260" r="18" fill="#34d399" opacity="0.2"/>
        </svg>`;
        const DEFAULT_BANNER_IMG = "data:image/svg+xml," + encodeURIComponent(DEFAULT_BANNER_SVG);

        const DEFAULT_EVENT_CONFIG = {
            title: 'State Youth Summit 2026',
            subtitle: 'November 15 - 17, 2026 • Grand Convention Center, Kozhikode',
            venue: 'Grand Convention Center, Kozhikode',
            imageUrl: DEFAULT_BANNER_IMG
        };

        const DEFAULT_CUSTOM_QUESTIONS = [
            { id: 'cq_1', label: 'T-Shirt Size', type: 'dropdown', options: 'S, M, L, XL, XXL', required: true },
            { id: 'cq_2', label: 'Dietary Preference', type: 'dropdown', options: 'Vegetarian, Non-Vegetarian, Vegan', required: false }
        ];

        function App() {
            const [activeTab, setActiveTab] = useState('register'); // register, leaderboard, admin
            const [registrations, setRegistrations] = useState(() => {
                const saved = localStorage.getItem('summit_registrations_2026');
                return saved ? JSON.parse(saved) : INITIAL_REGISTRATIONS;
            });

            const [eventConfig, setEventConfig] = useState(() => {
                const saved = localStorage.getItem('summit_event_config_2026');
                return saved ? JSON.parse(saved) : DEFAULT_EVENT_CONFIG;
            });

            const [customQuestions, setCustomQuestions] = useState(() => {
                const saved = localStorage.getItem('summit_custom_questions_2026');
                return saved ? JSON.parse(saved) : DEFAULT_CUSTOM_QUESTIONS;
            });

            // photoConfig can be 'disabled', 'optional', or 'mandatory'
            const [photoConfig, setPhotoConfig] = useState(() => {
                const saved = localStorage.getItem('summit_photo_config_2026');
                return saved ? saved : 'optional';
            });

            const [toast, setToast] = useState(null);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 4000);
            };

            useEffect(() => {
                localStorage.setItem('summit_registrations_2026', JSON.stringify(registrations));
            }, [registrations]);

            useEffect(() => {
                localStorage.setItem('summit_event_config_2026', JSON.stringify(eventConfig));
            }, [eventConfig]);

            useEffect(() => {
                localStorage.setItem('summit_custom_questions_2026', JSON.stringify(customQuestions));
            }, [customQuestions]);

            useEffect(() => {
                localStorage.setItem('summit_photo_config_2026', photoConfig);
            }, [photoConfig]);

            return (
                <div className="min-h-screen flex flex-col bg-gradient-to-br from-indigo-50/50 via-slate-50 to-purple-50/50">
                    {/* Toast Notification Banner */}
                    {toast && (
                        <div className="fixed top-5 right-5 z-50 animate-fade-in">
                            <div className={`px-5 py-3 rounded-xl shadow-lg border flex items-center space-x-3 text-sm font-medium ${
                                toast.type === 'success' ? 'bg-emerald-50 border-emerald-200 text-emerald-800' :
                                toast.type === 'error' ? 'bg-rose-50 border-rose-200 text-rose-800' :
                                'bg-indigo-50 border-indigo-200 text-indigo-800'
                            }`}>
                                <span>{toast.message}</span>
                            </div>
                        </div>
                    )}

                    {/* Header Bar */}
                    <header id="app-header" className="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
                            <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setActiveTab('register')}>
                                <div className="w-12 h-12 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-600 flex items-center justify-center text-white shadow-md font-extrabold text-xl">
                                    YS
                                </div>
                                <div>
                                    <h1 className="text-xl font-bold tracking-tight text-slate-900 truncate max-w-xs sm:max-w-md">{eventConfig.title}</h1>
                                    <p className="text-xs text-indigo-600 font-semibold tracking-wide uppercase">Kozhikode District Official Portal</p>
                                </div>
                            </div>
                            
                            <nav className="hidden md:flex items-center space-x-1">
                                <button 
                                    onClick={() => setActiveTab('register')}
                                    className={`px-4 py-2 rounded-lg text-sm font-medium transition-colors ${activeTab === 'register' ? 'bg-indigo-50 text-indigo-700 font-semibold' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'}`}
                                >
                                    Delegate Registration
                                </button>
                                <button 
                                    onClick={() => setActiveTab('leaderboard')}
                                    className={`px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center space-x-1.5 ${activeTab === 'leaderboard' ? 'bg-indigo-50 text-indigo-700 font-semibold' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'}`}
                                >
                                    <IconAward />
                                    <span>Constituency Leaderboard</span>
                                </button>
                                <button 
                                    onClick={() => setActiveTab('admin')}
                                    className={`px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center space-x-1.5 ${activeTab === 'admin' ? 'bg-indigo-600 text-white font-semibold shadow-sm' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100 border border-slate-200'}`}
                                >
                                    <IconShield />
                                    <span>Admin Panel</span>
                                </button>
                            </nav>
                        </div>
                    </header>

                    {/* Mobile Navigation */}
                    <div className="md:hidden bg-white border-b border-slate-200 px-4 py-2 flex justify-around text-xs font-medium text-slate-600">
                        <button onClick={() => setActiveTab('register')} className={`py-1.5 px-3 rounded-md ${activeTab === 'register' ? 'bg-indigo-50 text-indigo-700 font-bold' : ''}`}>Register</button>
                        <button onClick={() => setActiveTab('leaderboard')} className={`py-1.5 px-3 rounded-md ${activeTab === 'leaderboard' ? 'bg-indigo-50 text-indigo-700 font-bold' : ''}`}>Leaderboard</button>
                        <button onClick={() => setActiveTab('admin')} className={`py-1.5 px-3 rounded-md ${activeTab === 'admin' ? 'bg-indigo-600 text-white font-bold' : ''}`}>Admin</button>
                    </div>

                    {/* Main Body */}
                    <main className="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        {activeTab === 'register' && <RegistrationSection eventConfig={eventConfig} registrations={registrations} setRegistrations={setRegistrations} customQuestions={customQuestions} photoConfig={photoConfig} showToast={showToast} />}
                        {activeTab === 'leaderboard' && <LeaderboardSection registrations={registrations} />}
                        {activeTab === 'admin' && <AdminSection eventConfig={eventConfig} setEventConfig={setEventConfig} registrations={registrations} setRegistrations={setRegistrations} customQuestions={customQuestions} setCustomQuestions={setCustomQuestions} photoConfig={photoConfig} setPhotoConfig={setPhotoConfig} showToast={showToast} />}
                    </main>

                    {/* Footer */}
                    <footer className="bg-slate-900 text-slate-400 py-8 mt-auto border-t border-slate-800">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row items-center justify-between text-sm">

                            <p className="mt-2 md:mt-0">Venue: {eventConfig.venue}</p>
                        </div>
                    </footer>
                </div>
            );
        }

        function RegistrationSection({ eventConfig, registrations, setRegistrations, customQuestions, photoConfig, showToast }) {
            const [formData, setFormData] = useState({
                fullName: '',
                phone: '',
                email: '',
                panchayat: '',
                constituency: '',
                campusType: 'none',
                campusName: '',
                position: '',
                photo: null
            });

            const [customAnswers, setCustomAnswers] = useState({});

            const [otpState, setOtpState] = useState('idle'); // idle, sent, verified
            const [generatedOtp, setGeneratedOtp] = useState('');
            const [enteredOtp, setEnteredOtp] = useState('');
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [successResult, setSuccessResult] = useState(null);

            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const handleCustomAnswerChange = (questionLabel, value) => {
                setCustomAnswers(prev => ({ ...prev, [questionLabel]: value }));
            };

            const handlePhotoUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setFormData(prev => ({ ...prev, photo: reader.result }));
                        showToast('Delegate photo uploaded successfully!', 'success');
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleSendOtp = () => {
                if (!formData.email || !formData.email.includes('@')) {
                    showToast('Please enter a valid email address first.', 'error');
                    return;
                }
                const randomOtp = Math.floor(100000 + Math.random() * 900000).toString();
                setGeneratedOtp(randomOtp);
                setOtpState('sent');
                showToast(`[Simulated Email Sent] OTP to ${formData.email}: ${randomOtp}`, 'info');
            };

            const handleVerifyOtp = () => {
                if (enteredOtp.trim() === generatedOtp) {
                    setOtpState('verified');
                    showToast('Email verified successfully!', 'success');
                } else {
                    showToast('Invalid OTP code. Please check and try again.', 'error');
                }
            };

            const handleSubmitRegistration = (e) => {
                e.preventDefault();
                if (otpState !== 'verified') {
                    showToast('Please verify your email with OTP before submitting.', 'error');
                    return;
                }
                if (photoConfig === 'mandatory' && !formData.photo) {
                    showToast('Registrant photo upload is required for this event.', 'error');
                    return;
                }

                setIsSubmitting(true);
                setTimeout(() => {
                    const newRegId = 'REG-' + (1000 + registrations.length + 1);
                    const finalCampus = formData.campusType === 'custom' ? formData.campusName : 'None';
                    const newEntry = {
                        id: newRegId,
                        fullName: formData.fullName,
                        phone: formData.phone,
                        email: formData.email,
                        panchayat: formData.panchayat,
                        constituency: formData.constituency,
                        campus: finalCampus,
                        position: formData.position || 'Delegate',
                        status: 'Pending',
                        date: new Date().toISOString().split('T')[0],
                        photo: photoConfig !== 'disabled' ? (formData.photo || null) : null,
                        customAnswers: { ...customAnswers }
                    };

                    setRegistrations(prev => [newEntry, ...prev]);
                    setIsSubmitting(false);
                    setSuccessResult(newEntry);
                    showToast('Registration submitted successfully! Visible in admin panel.', 'success');
                }, 600);
            };

            if (successResult) {
                return (
                    <div className="max-w-2xl mx-auto bg-white rounded-2xl shadow-xl border border-slate-100 p-8 text-center animate-fade-in my-8">
                        <div className="w-16 h-16 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-4">
                            <IconCheckCircle />
                        </div>
                        <h2 className="text-2xl font-bold text-slate-900 mb-2">Registration Submitted Successfully!</h2>
                        <p className="text-slate-600 mb-6">Thank you for registering for {eventConfig.title}. Your details have been accurately recorded and are currently <span className="font-semibold text-amber-600">Pending Admin Approval</span>.</p>
                        
                        <div className="bg-slate-50 rounded-xl p-6 text-left mb-6 border border-slate-200">
                            <div className="flex items-center space-x-4 mb-4 pb-4 border-b border-slate-200">
                                {successResult.photo ? (
                                    <img src={successResult.photo} alt="Delegate" className="w-16 h-16 rounded-xl object-cover border border-slate-300 shadow-sm" />
                                ) : (
                                    <div className="w-16 h-16 rounded-xl bg-indigo-100 text-indigo-700 flex items-center justify-center font-bold text-lg">
                                        {successResult.fullName.charAt(0)}
                                    </div>
                                )}
                                <div>
                                    <div className="text-xs text-indigo-600 font-semibold font-mono">{successResult.id}</div>
                                    <div className="text-lg font-bold text-slate-900">{successResult.fullName}</div>
                                    <div className="text-xs text-slate-500">{successResult.email} • {successResult.phone}</div>
                                </div>
                            </div>
                            <div className="grid grid-cols-2 gap-4 text-sm">
                                <div><span className="text-slate-500">Constituency:</span> <span className="font-semibold text-slate-800">{successResult.constituency}</span></div>
                                <div><span className="text-slate-500">Panchayat:</span> <span className="font-semibold text-slate-800">{successResult.panchayat}</span></div>
                                <div><span className="text-slate-500">Campus:</span> <span className="font-semibold text-slate-800">{successResult.campus}</span></div>
                                <div><span className="text-slate-500">Status:</span> <span className="px-2 py-0.5 rounded-full text-xs font-bold bg-amber-100 text-amber-800">{successResult.status}</span></div>
                                {Object.entries(successResult.customAnswers || {}).map(([k, v]) => (
                                    <div key={k} className="col-span-2"><span className="text-slate-500">{k}:</span> <span className="font-semibold text-slate-800">{v}</span></div>
                                ))}
                            </div>
                        </div>

                        <button 
                            onClick={() => {
                                setSuccessResult(null);
                                setFormData({ fullName: '', phone: '', email: '', panchayat: '', constituency: '', campusType: 'none', campusName: '', position: '', photo: null });
                                setCustomAnswers({});
                                setOtpState('idle');

        function LeaderboardSection({ registrations }) {
            const approvedRegistrations = useMemo(() => {
                return registrations.filter(r => r.status === 'Approved');

            const constituencyStats = useMemo(() => {
                const counts = {};
                approvedRegistrations.forEach(r => {
                    counts[r.constituency] = (counts[r.constituency] || 0) + 1;
                });

                const list = CONSTITUENCIES.map(c => ({
                    constituency: c,
                    count: counts[c] || 0
                }));

                list.sort((a, b) => b.count - a.count);
                return list;
            }, [approvedRegistrations]);

            const maxCount = constituencyStats.length > 0 ? Math.max(...constituencyStats.map(s => s.count), 1) : 1;

            return (
                <div className="max-w-4xl mx-auto space-y-8 animate-fade-in">
                    <div className="bg-white rounded-3xl shadow-xl border border-slate-100 p-6 sm:p-10">

                                let badgeColor = 'bg-slate-100 text-slate-700 border-slate-200';
                                if (rank === 1) badgeColor = 'bg-amber-100 text-amber-800 border-amber-300 font-bold';
                                if (rank === 2) badgeColor = 'bg-slate-200 text-slate-800 border-slate-300 font-bold';
                                if (rank === 3) badgeColor = 'bg-orange-100 text-orange-800 border-orange-300 font-bold';

                                return (
                                    <div key={item.constituency} className="bg-slate-50 border border-slate-200/80 rounded-2xl p-4 sm:p-5 transition-all hover:shadow-md">

                                            <div className="flex items-center space-x-3">
                                                <div className={`w-8 h-8 rounded-xl flex items-center justify-center text-sm border ${badgeColor}`}>
                                                    #{rank}
                                                </div>

                                                style={{ width: `${Math.max(percentage, 3)}%` }}

        function AdminSection({ eventConfig, setEventConfig, registrations, setRegistrations, customQuestions, setCustomQuestions, photoConfig, setPhotoConfig, showToast }) {
            // Admin authentication state with trusted email check
            const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(() => {
                return localStorage.getItem('summit_admin_logged_in_2026') === 'true';
            });
            const [loginMode, setLoginMode] = useState(() => {
                const trustedEmail = localStorage.getItem('summit_trusted_admin_email_2026');
                return trustedEmail ? 'emailOnly' : 'full';
            });

            const [usernameInput, setUsernameInput] = useState('');
            const [passwordInput, setPasswordInput] = useState('');
            const [emailInput, setEmailInput] = useState(() => {
                return localStorage.getItem('summit_trusted_admin_email_2026') || '';
            });

            const [adminSubTab, setAdminSubTab] = useState('registrations'); // registrations, headerEditor, formBuilder

            // Header edit form state
            const [headerForm, setHeaderForm] = useState(eventConfig);
            
            // Notification dispatch modal state for approvals
            const [notificationModalData, setNotificationModalData] = useState(null);

            // New Question Modal or Builder state
            const [newQuestion, setNewQuestion] = useState({ label: '', type: 'dropdown', options: '', required: false });
            // Edit Question State
            const [editingQuestionId, setEditingQuestionId] = useState(null);
            const [editQuestionForm, setEditQuestionForm] = useState({ label: '', type: 'dropdown', options: '', required: false });

            // Search & Filters
            const [searchQuery, setSearchQuery] = useState('');
            const [filterConstituency, setFilterConstituency] = useState('All');
            const [filterStatus, setFilterStatus] = useState('All');
            const [filterCampus, setFilterCampus] = useState('All');

            // Custom delete confirmation state
            const [deleteTargetId, setDeleteTargetId] = useState(null);

            const handleLogin = (e) => {
                e.preventDefault();
                if (loginMode === 'emailOnly') {
                    const trustedEmail = localStorage.getItem('summit_trusted_admin_email_2026');
                    if (emailInput.trim().toLowerCase() === trustedEmail?.toLowerCase()) {
                        setIsAdminLoggedIn(true);
                        localStorage.setItem('summit_admin_logged_in_2026', 'true');
                        showToast('Welcome back, Admin!', 'success');
                    } else {
                        showToast('Unrecognized admin email ID. Please log in with username and password.', 'error');
                        setLoginMode('full');
                    }
                } else {
                    if (usernameInput.trim() === 'nishanadmin' && passwordInput === '807511' && emailInput.trim().includes('@')) {
                        setIsAdminLoggedIn(true);
                        localStorage.setItem('summit_admin_logged_in_2026', 'true');
                        localStorage.setItem('summit_trusted_admin_email_2026', emailInput.trim());
                        showToast('Admin login successful!', 'success');
                    } else {
                        showToast('Invalid credentials. Username must be nishanadmin, password 807511, and valid email.', 'error');
                    }
                }
            };

            const handleLogout = () => {
                setIsAdminLoggedIn(false);
                localStorage.removeItem('summit_admin_logged_in_2026');
                setUsernameInput('');
                setPasswordInput('');
                showToast('Logged out of admin panel.', 'info');
            };

            const handleStatusChange = (id, newStatus) => {
                setRegistrations(prev => prev.map(reg => {
                    if (reg.id === id) {
                        const updated = { ...reg, status: newStatus };
                        if (newStatus === 'Approved') {
                            updated.notificationSent = true;
                            setNotificationModalData({
                                delegateName: reg.fullName,
                                email: reg.email,
                                phone: reg.phone,
                                id: reg.id
                            });
                        }
                        return updated;
                    }
                    return reg;
                }));
                showToast(`Registration ${id} updated to ${newStatus}`, 'success');
            };

            const confirmDelete = (id) => {
                setRegistrations(prev => prev.filter(reg => reg.id !== id));
                setDeleteTargetId(null);
                showToast(`Registration ${id} deleted successfully`, 'info');
            };

            const handleSaveHeader = (e) => {
                e.preventDefault();
                setEventConfig(headerForm);
                showToast('Event header updated successfully!', 'success');
            };

            const handleImageFileUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setHeaderForm(prev => ({ ...prev, imageUrl: reader.result }));
                        showToast('Banner image uploaded and previewed successfully!', 'success');
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleAddQuestion = (e) => {
                e.preventDefault();
                if (!newQuestion.label.trim()) {
                    showToast('Please enter a question label.', 'error');
                    return;
                }
                const qId = 'cq_' + Date.now();
                setCustomQuestions(prev => [...prev, { ...newQuestion, id: qId }]);
                setNewQuestion({ label: '', type: 'dropdown', options: '', required: false });
                showToast('Custom question added successfully!', 'success');
            };

            const handleDeleteQuestion = (id) => {
                setCustomQuestions(prev => prev.filter(q => q.id !== id));
                showToast('Custom question removed.', 'info');
            };

            const startEditQuestion = (q) => {
                setEditingQuestionId(q.id);
                setEditQuestionForm({ label: q.label, type: q.type, options: q.options || '', required: q.required });
            };

            const handleSaveEditedQuestion = (e) => {
                e.preventDefault();
                if (!editQuestionForm.label.trim()) {
                    showToast('Question label cannot be empty.', 'error');
                    return;
                }
                setCustomQuestions(prev => prev.map(q => q.id === editingQuestionId ? { ...q, ...editQuestionForm } : q));
                setEditingQuestionId(null);
                showToast('Question updated successfully!', 'success');
            };

            const exportToCSV = () => {
                const headers = ['ID', 'Full Name', 'Phone', 'Email', 'Panchayat', 'Constituency', 'Campus', 'Position', 'Status', 'Date'];
                const rows = filteredRegistrations.map(r => [
                    r.id,
                    `"${r.fullName}"`,
                    r.phone,
                    r.email,
                    `"${r.panchayat}"`,
                    `"${r.constituency}"`,
                    `"${r.campus}"`,
                    `"${r.position}"`,
                    r.status,
                    r.date
                ]);

                const csvContent = "data:text/csv;charset=utf-8," + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement('a');
                link.setAttribute('href', encodedUri);
                link.setAttribute('download', `kozhikode_youth_summit_registrations_${new Date().toISOString().split('T')[0]}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast('Registration data exported to CSV successfully!', 'success');
            };

            const filteredRegistrations = useMemo(() => {
                return registrations.filter(r => {
                    const matchesSearch = 
                        r.fullName.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        r.email.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        r.phone.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        r.constituency.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        r.panchayat.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        r.id.toLowerCase().includes(searchQuery.toLowerCase());
                    
                    const matchesConstituency = filterConstituency === 'All' || r.constituency === filterConstituency;
                    const matchesStatus = filterStatus === 'All' || r.status === filterStatus;
                    const matchesCampus = filterCampus === 'All' || (filterCampus === 'None' ? r.campus === 'None' : r.campus !== 'None');

                    return matchesSearch && matchesConstituency && matchesStatus && matchesCampus;
                });
            }, [registrations, searchQuery, filterConstituency, filterStatus, filterCampus]);

            const stats = useMemo(() => {
                const total = registrations.length;
                const approved = registrations.filter(r => r.status === 'Approved').length;
                const pending = registrations.filter(r => r.status === 'Pending').length;

                                            onChange={(e) => setSearchQuery(e.target.value)}
                                            placeholder="Search name, phone, email..." 
                                            className="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none text-sm"
                                        />
                                    </div>
                                    <div>
                                        <select 
                                            value={filterConstituency} 
                                            onChange={(e) => setFilterConstituency(e.target.value)}
                                            className="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none text-sm bg-white"
                                        >
                                            <option value="All">All Kozhikode Constituencies</option>
                                            {CONSTITUENCIES.map(c => <option key={c} value={c}>{c}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <select 
                                            value={filterStatus} 
                                            onChange={(e) => setFilterStatus(e.target.value)}
                                            className="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none text-sm bg-white"
                                        >
                                            <option value="All">All Statuses</option>
                                            <option value="Approved">Approved</option>
                                            <option value="Pending">Pending</option>
                                            <option value="Rejected">Rejected</option>
                                        </select>
                                    </div>
                                    <div>
                                        <select 
                                            value={filterCampus} 
                                            onChange={(e) => setFilterCampus(e.target.value)}
                                            className="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none text-sm bg-white"
                                        >
                                            <option value="All">All Campuses</option>
                                            <option value="None">No Campus (None)</option>
                                            <option value="Custom">With Campus</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            {/* Data Table */}
                            <div className="bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden">
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left border-collapse">
                                        <thead>
                                            <tr className="bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-600 uppercase tracking-wider">
                                                <th className="py-4 px-6">Delegate Info</th>
                                                <th className="py-4 px-6">Constituency / Panchayat</th>
                                                <th className="py-4 px-6">Campus</th>
                                                <th className="py-4 px-6">Position</th>
                                                <th className="py-4 px-6">Status</th>
                                                <th className="py-4 px-6 text-right">Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100 text-sm">
                                            {filteredRegistrations.length === 0 ? (
                                                <tr>
                                                    <td colSpan="6" className="text-center py-12 text-slate-500">
                                                        No registrations match your search criteria.
                                                    </td>
                                                </tr>
                                            ) : (
                                                filteredRegistrations.map(reg => (
                                                    <tr key={reg.id} className="hover:bg-slate-50/60 transition-colors">
                                                        <td className="py-4 px-6">
                                                            <div className="flex items-center space-x-3">
                                                                {reg.photo ? (
                                                                    <img src={reg.photo} alt="Delegate" className="w-10 h-10 rounded-xl object-cover border border-slate-200 shadow-sm flex-shrink-0" />
                                                                ) : (
                                                                    <div className="w-10 h-10 rounded-xl bg-indigo-100 text-indigo-700 flex items-center justify-center font-bold text-sm flex-shrink-0">
                                                                        {reg.fullName.charAt(0)}
                                                                    </div>
                                                                )}
                                                                <div>
                                                                    <div className="font-bold text-slate-900">{reg.fullName}</div>
                                                                    <div className="text-xs text-slate-500">{reg.email} • {reg.phone}</div>
                                                                    <div className="text-[10px] text-indigo-600 font-mono mt-0.5">{reg.id}</div>
                                                                </div>
                                                            </div>
                                                        </td>
                                                        <td className="py-4 px-6">
                                                            <div className="font-semibold text-slate-800">{reg.constituency}</div>
                                                            <div className="text-xs text-slate-500">{reg.panchayat}</div>
                                                        </td>
                                                        <td className="py-4 px-6">
                                                            <div className="text-slate-700">{reg.campus}</div>
                                                        </td>
                                                        <td className="py-4 px-6">
                                                            <div className="text-slate-700">{reg.position}</div>
                                                        </td>
                                                        <td className="py-4 px-6">
                                                            <span className={`px-2.5 py-1 rounded-full text-xs font-bold flex items-center w-max gap-1 ${
                                                                reg.status === 'Approved' ? 'bg-emerald-100 text-emerald-800' :
                                                                reg.status === 'Rejected' ? 'bg-rose-100 text-rose-800' :
                                                                'bg-amber-100 text-amber-800'
                                                            }`}>
                                                                {reg.status}
                                                                {reg.status === 'Approved' && <span className="text-[10px] bg-emerald-200 px-1.5 py-0.5 rounded text-emerald-900 font-mono">Notified</span>}
                                                            </span>
                                                        </td>
                                                        <td className="py-4 px-6 text-right space-x-2">
                                                            {reg.status !== 'Approved' && (
                                                                <button 
                                                                    onClick={() => handleStatusChange(reg.id, 'Approved')}
                                                                    className="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-semibold px-3 py-1.5 rounded-lg text-xs transition-colors"
                                                                >
                                                                    Approve
                                                                </button>
                                                            )}
                                                            {reg.status !== 'Rejected' && (
                                                                <button 
                                                                    onClick={() => handleStatusChange(reg.id, 'Rejected')}
                                                                    className="bg-rose-50 hover:bg-rose-100 text-rose-700 font-semibold px-3 py-1.5 rounded-lg text-xs transition-colors"
                                                                >
                                                                    Reject
                                                                </button>
                                                            )}
                                                            <button 
                                                                onClick={() => setDeleteTargetId(reg.id)}
                                                                className="text-slate-400 hover:text-rose-600 font-semibold px-2 py-1.5 rounded-lg text-xs transition-colors"
                                                                title="Delete Registration"
                                                            >
                                                                Delete
                                                            </button>
                                                        </td>
                                                    </tr>
                                                ))
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
